parameters:
    kernel.project_dir: '%env(resolve:PROJECT_DIR)%'
    kernel.logs_dir: '%kernel.project_dir%/var/log'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Tests/'
            - '../src/Game/Entity'
            - '../src/Session/Entity'
            - '../src/SessionEventPlatform/Event'
            - '../src/Application/Event'
            - '../src/Core/Attribute/'

    redis.default:
        class: App\Redis\RedisClient
        calls:
            - method: connect
              arguments:
                - 'redis'
                - 6379
                - 0

    redis.word_repository:
        class: App\Redis\RedisClient
        calls:
            - method: connect
              arguments:
                - 'redis'
                - 6379
                - 1

    App\Application\Repository\Redis\Game\RedisGameRepository:
        arguments:
            $redis: '@redis.default'

    App\Application\Repository\Redis\Session\RedisSessionRepository:
        arguments:
            $redis: '@redis.default'

    App\Application\Repository\Redis\Game\RedisWordRepository:
        arguments:
            $redis: '@redis.word_repository'
            $dbIndex: 1

    App\Session\Service\TimerService:
        tags:
            - { name: 'app.service' }

    App\SessionEventPlatform\Handler\:
        resource: '../src/SessionEventPlatform/Handler/*'
        tags: ['app.message_handler']

    App\Application\Handler\:
        resource: '../src/Application/Handler/*'
        tags: ['app.message_handler']

    App\Core\Dispatcher\EventDispatcher:
        arguments:
            $handlers: []
            $eventClassMap: '%event_map%'
        calls:
            - method: setHandlers
              arguments:
                - !tagged_iterator app.message_handler
    
    App\Core\Dispatcher\WebSocketDispatcherInterface: '@App\Core\Dispatcher\EventDispatcher'

    App\Connection\ConnectionStorageInterface: '@App\Connection\ConnectionStorage'

    App\Session\Repository\SessionRepositoryInterface: '@App\Application\Repository\Redis\Session\RedisSessionRepository'

    App\Game\Repository\WordRepositoryInterface: '@App\Application\Repository\Redis\Game\RedisWordRepository'

    App\Session\Service\SessionServiceInterface: '@App\Session\Service\SessionService'

    App\GameServer:
        arguments:
            $dispatcher: '@App\Core\Dispatcher\WebSocketDispatcherInterface'
            $connectionStorage: '@App\Connection\ConnectionStorage'
            $logger: '@websocket.logger'

    App\Game\Repository\GameRepositoryInterface: '@App\Application\Repository\Redis\Game\RedisGameRepository'